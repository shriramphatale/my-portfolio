<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shriram Phatale — Full-Stack Developer & AI Systems</title>
    <meta
      name="description"
      content="Full-Stack Developer based in Pune, India. I build full-stack applications and AI-powered products with clean interfaces and reliable backend systems."
    />
    <meta name="author" content="Shriram Phatale" />
    <meta name="theme-color" content="#090909" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Shriram Phatale — Full-Stack Developer" />
    <meta
      property="og:description"
      content="I build full-stack applications and AI-powered products with clean interfaces and reliable backend systems."
    />
    <meta property="og:type" content="website" />

    <!-- Preload OCR A Tribute Font -->
    <link
      rel="preload"
      href="/fonts/OCR-A-Tribute-W01-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />

    <!-- Theme Initialization: default to dark, prevent FOUC -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme') || 'dark';
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#090909] text-[#f4f4f5] antialiased selection:bg-zinc-800 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
